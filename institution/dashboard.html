<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard | Annexity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <nav class="side"></nav>
  <div class="main">
    <header class="top"></header>
    <div class="content">

      <div class="grid g-4" style="margin-bottom:18px">
        <div class="card stat"><div class="lbl">Students</div><div class="val" id="k1">—</div><div class="delta" id="k1d"></div></div>
        <div class="card stat"><div class="lbl">Active this week</div><div class="val" id="k2">—</div><div class="delta">Reported by the app</div></div>
        <div class="card stat"><div class="lbl">Median accuracy</div><div class="val" id="k3">—</div><div class="delta" id="k3d">Across students with data</div></div>
        <div class="card stat"><div class="lbl">Flagged</div><div class="val" id="k4">—</div><div class="delta">Set by your staff</div></div>
      </div>

      <div class="card" style="margin-bottom:18px">
        <div class="card-head">
          <h2>Quiet for a while</h2>
          <span class="hint">Students with no reported activity in 14 days</span>
        </div>
        <div id="quiet"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Students</h2>
          <span class="spacer"></span>
          <a class="btn ghost sm" href="roster.html">Open the full list</a>
        </div>
        <div class="card-body flush tbl-wrap">
          <table>
            <thead><tr><th>Student</th><th>ID</th><th style="text-align:right">Lessons</th>
              <th>Accuracy</th><th>Last active</th><th>Status</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="portal.js?v=2"></script>
<script src="portal-data.js?v=1"></script>
<script>
(async function () {
  if (!await requireSession()) return;

  let roster = [];
  try {
    const ctx = await loadContext();
    if (!ctx.membership) { pageError("This account is not on any program's staff list."); return; }
    CTX = { institution: ctx.membership.institutions, role: ctx.membership.role, email: ctx.email };
    shell("dashboard.html", "Dashboard", CTX.institution.display_name || CTX.institution.name);
    roster = await loadRoster(CTX.institution.id);
  } catch (err) {
    pageError("Could not load the dashboard: " + (err.message || err));
    return;
  }

  const withData = roster.filter(s => s.accuracy != null);
  const days = s => s.lastActive
    ? Math.floor((Date.now() - new Date(s.lastActive + "T00:00:00")) / 86400000) : Infinity;

  // Median, not mean. One student answering 1,200 questions at 40% drags an average
  // somewhere no individual actually is, and this number's whole job is to describe
  // the middle of the cohort.
  const median = arr => {
    if (!arr.length) return null;
    const v = [...arr].sort((a, b) => a - b), m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : Math.round((v[m - 1] + v[m]) / 2);
  };

  document.getElementById("k1").textContent = roster.length;
  document.getElementById("k1d").textContent = CTX.institution.seats
    ? roster.length + " of " + CTX.institution.seats + " seats" : "";
  document.getElementById("k2").textContent = roster.filter(s => days(s) <= 7).length;

  const med = median(withData.map(s => s.accuracy));
  document.getElementById("k3").textContent = med == null ? "—" : med + "%";
  document.getElementById("k3d").textContent = withData.length
    ? "Across " + withData.length + " with data" : "No students have reported yet";

  const flagged = roster.filter(s => s.status === "at_risk" || s.status === "tutoring");
  const k4 = document.getElementById("k4");
  k4.textContent = flagged.length;
  if (flagged.length) k4.style.color = "var(--siren)";

  // Quiet students, not "at risk". The app knows one thing — that nothing has been
  // reported — and saying only that leaves the judgement where it belongs.
  const quiet = roster.filter(s => days(s) >= 14)
    .sort((a, b) => days(b) - days(a));
  document.getElementById("quiet").innerHTML = quiet.length
    ? quiet.map(s =>
        '<div class="alert-row"><span class="dot warn"></span>' +
        '<div><b><a href="student.html?id=' + encodeURIComponent(s.id) + '">' + esc(s.name) + '</a></b>' +
        '<div class="why">Last reported activity: ' + esc(sinceLabel(s.lastActive)) + '.' +
        (s.status !== "none" ? ' Flagged as ' + esc(statusLabel(s.status)) + '.' : '') + '</div></div></div>'
      ).join("")
    : '<div class="empty">' + (roster.length
        ? "Everyone has been active in the last two weeks."
        : "No students on the roster yet.") + '</div>';

  document.getElementById("rows").innerHTML = roster.length
    ? roster.slice(0, 10).map(s =>
        '<tr><td><a class="who-cell" href="student.html?id=' + encodeURIComponent(s.id) + '">' +
        '<span class="avatar">' + initials(s.name) + '</span>' +
        '<span><b>' + esc(s.name) + '</b><small>' + esc(s.cohort) + '</small></span></a></td>' +
        '<td class="mono">' + esc(s.studentNumber) + '</td>' +
        '<td class="num">' + s.lessons + '</td>' +
        '<td style="min-width:140px">' + bar(s.accuracy) + '</td>' +
        '<td>' + esc(sinceLabel(s.lastActive)) + '</td>' +
        '<td>' + statusPill(s.status) + '</td></tr>').join("")
    : '<tr><td colspan="6"><div class="empty"><b>No students yet.</b><br>' +
      'They appear here once they join with your program code.</div></td></tr>';
})();
</script>
</body>
</html>
