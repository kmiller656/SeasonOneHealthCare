<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lesson plans | Annexity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <nav class="side"></nav>
  <div class="main">
    <header class="top"></header>
    <div class="content">
      <div class="card">
        <div class="card-head">
          <h2>Lesson plans</h2>
          <span class="hint" id="count"></span>
        </div>
        <div id="list"></div>
      </div>

      <p class="note" style="max-width:640px;margin-top:16px">
        Building a plan &mdash; picking conditions, setting a due date and a daily pace, and
        assigning it to students or a whole cohort &mdash; is the next piece being built.
        Plans already assigned show here and in each student's profile.
      </p>

    </div>
  </div>
</div>
<script src="portal.js?v=2"></script>
<script src="portal-data.js?v=1"></script>
<script>
(async function () {
  if (!await requireSession()) return;
  try {
    const ctx = await loadContext();
    if (!ctx.membership) { pageError("This account is not on any program's staff list."); return; }
    CTX = { institution: ctx.membership.institutions, role: ctx.membership.role, email: ctx.email };
    shell("assignments.html", "Lesson plans", CTX.institution.display_name || CTX.institution.name);
    const { data, error } = await sb.from("assignments")
      .select("id, title, due_at, lessons_per_day, condition_ids, created_at")
      .eq("institution_id", CTX.institution.id)
      .order("created_at", { ascending: false });
    if (error) throw error;

    const targets = {};
    if (data && data.length) {
      const { data: t } = await sb.from("assignment_targets")
        .select("assignment_id").in("assignment_id", data.map(a => a.id));
      for (const row of t || []) targets[row.assignment_id] = (targets[row.assignment_id] || 0) + 1;
    }

    document.getElementById("count").textContent =
      (data || []).length + ((data || []).length === 1 ? " plan" : " plans");
    document.getElementById("list").innerHTML = (data || []).length
      ? '<div class="card-body flush tbl-wrap"><table><thead><tr><th>Plan</th><th>Due</th>' +
        '<th>Pace</th><th style="text-align:right">Lessons</th><th style="text-align:right">Students</th>' +
        '</tr></thead><tbody>' + data.map(a =>
          '<tr><td><b>' + esc(a.title) + '</b></td>' +
          '<td>' + (a.due_at ? esc(new Date(a.due_at).toLocaleDateString()) : '<span class="muted">No date</span>') + '</td>' +
          '<td>' + (a.lessons_per_day ? a.lessons_per_day + '/day' : '<span class="muted">Their own pace</span>') + '</td>' +
          '<td class="num">' + (a.condition_ids || []).length + '</td>' +
          '<td class="num">' + (targets[a.id] || 0) + '</td></tr>').join("") +
        '</tbody></table></div>'
      : '<div class="empty"><b>No lesson plans yet.</b><br>' +
        'Once you can build one, it will appear here and in each student\'s profile.</div>';
  } catch (err) {
    pageError("Could not load this page: " + (err.message || err));
  }
})();
</script>
</body>
</html>
