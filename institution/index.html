<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Annexity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="auth">

    <a class="auth-mark" href="https://annexity.com" aria-label="Annexity">
      <svg viewBox="0 0 252 217.4" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <polygon fill="#69A0E2" points="125.8,0.0 167.0,73.3 125.4,144.5 84.3,71.5"/>
        <polygon fill="#375A9C" points="167.0,73.3 208.3,144.9 125.4,144.5"/>
        <polygon fill="#6189D8" points="41.0,145.4 125.4,144.5 83.7,217.4 0.0,217.3"/>
        <polygon fill="#11235A" points="125.4,144.5 208.3,144.9 252.0,216.8 167.5,216.9"/>
      </svg>
      <span>Annexity</span>
    </a>

    <!--
      Two tabs because two different people arrive here and want different things.
      A real tablist rather than two links: arrow keys move between them, only the
      selected tab is in the tab order, and each panel is labelled by its tab.
    -->
    <div class="tabs" role="tablist" aria-label="Who is signing in">
      <button class="tab" role="tab" id="tab-admin" aria-controls="panel-admin"
              aria-selected="true" tabindex="0">Program staff</button>
      <button class="tab" role="tab" id="tab-student" aria-controls="panel-student"
              aria-selected="false" tabindex="-1">Student</button>
    </div>

    <section class="panel" role="tabpanel" id="panel-admin" aria-labelledby="tab-admin">
      <p class="lede">Sign in to your program's account.</p>

      <div class="alert" id="admin-error" role="alert" hidden></div>

      <form id="admin-form">
        <div class="field">
          <label for="admin-email">Work email</label>
          <input id="admin-email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="admin-pass">Password</label>
          <input id="admin-pass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="admin-submit">Sign in</button>
      </form>

      <p class="auth-alt">
        No account yet? <a href="https://annexity.com/institutions">Talk to us about your program</a>
      </p>
    </section>

    <section class="panel" role="tabpanel" id="panel-student" aria-labelledby="tab-student" hidden>
      <p class="lede">Sign in to see what your program has assigned you.</p>

      <div class="alert" id="student-error" role="alert" hidden></div>

      <form id="student-form">
        <div class="field">
          <label for="student-email">Email</label>
          <input id="student-email" type="email" autocomplete="username"
                 placeholder="you@school.edu" required>
        </div>
        <div class="field">
          <label for="student-pass">Password</label>
          <input id="student-pass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="student-submit">Sign in</button>
      </form>

      <p class="auth-alt">
        Don't have the app yet? <a href="https://annexity.com/#beta">Join the beta</a>
      </p>
    </section>

  </div>
</div>

<script>
// Roving tabindex: one tab in the page's tab order at a time, arrows move between
// them. Without it a keyboard user tabs through every tab before reaching the form.
(function () {
  var tabs = [].slice.call(document.querySelectorAll('[role="tab"]'));

  function select(tab) {
    tabs.forEach(function (t) {
      var panel = document.getElementById(t.getAttribute('aria-controls'));
      var on = t === tab;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      panel.hidden = !on;
    });
  }

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(tab); });
    tab.addEventListener('keydown', function (e) {
      var next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null;
      if (next === null) return;
      e.preventDefault();
      var target = tabs[(next + tabs.length) % tabs.length];
      select(target);
      target.focus();
    });
  });
})();
</script>
<script src="portal-data.js?v=1"></script>
<script>
// Sign-in. Both tabs authenticate against the same Supabase project — there is one
// account per person, and the tab decides where they land, not who they are.
(function () {
  function fail(box, message) {
    box.textContent = message;
    box.hidden = false;
  }

  // Supabase returns "Invalid login credentials" for a wrong password and for an
  // address that has no account, deliberately, so the form cannot be used to find
  // out who has one. Saying "check both" is honest about that rather than implying
  // the address was right.
  function readable(error) {
    var m = (error && error.message) || "";
    if (/invalid login/i.test(m)) return "That email and password did not match. Check both and try again.";
    if (/email not confirmed/i.test(m)) return "This account still needs confirming. Open the link in the sign-up email first.";
    if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute and try again.";
    return m || "Could not sign in. Try again.";
  }

  document.getElementById("admin-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var box = document.getElementById("admin-error"), btn = document.getElementById("admin-submit");
    box.hidden = true; btn.disabled = true; btn.textContent = "Signing in…";
    try {
      var res = await sb.auth.signInWithPassword({
        email: document.getElementById("admin-email").value.trim(),
        password: document.getElementById("admin-pass").value
      });
      if (res.error) throw res.error;

      var ctx = await loadContext();
      if (ctx.membership) { location.href = "dashboard.html"; return; }

      // Signed in, but not staff anywhere. Say which of the two it is.
      await sb.auth.signOut();
      fail(box, ctx.isStudentOnly
        ? "This is a student account. Students study in the Annexity app — use the Student tab if you are looking for your assignments."
        : "This account is not on any program's staff list yet. Ask your program administrator to add you, or talk to us about setting your program up.");
    } catch (err) {
      fail(box, readable(err));
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  document.getElementById("student-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var box = document.getElementById("student-error"), btn = document.getElementById("student-submit");
    box.hidden = true; btn.disabled = true; btn.textContent = "Signing in…";
    try {
      var res = await sb.auth.signInWithPassword({
        email: document.getElementById("student-email").value.trim(),
        password: document.getElementById("student-pass").value
      });
      if (res.error) throw res.error;
      location.href = "me.html";
    } catch (err) {
      fail(box, readable(err));
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });
})();
</script>
</body>
</html>
