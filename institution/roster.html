<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Students | Annexity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <nav class="side"></nav>
  <div class="main">
    <header class="top"></header>
    <div class="content">

      <div class="card">
        <div class="card-head">
          <h2>Students</h2>
          <span class="hint" id="count">Loading…</span>
          <span class="spacer"></span>
          <input class="search" id="search" type="search" placeholder="Search name or ID" aria-label="Search students">
          <select id="statusFilter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="at_risk">At risk</option>
            <option value="tutoring">Tutoring</option>
            <option value="drs">Disability Resource Services</option>
            <option value="inactive">Inactive</option>
            <option value="none">No flag</option>
          </select>
        </div>
        <div class="card-body flush tbl-wrap">
          <table>
            <thead><tr>
              <th>Student</th>
              <th>ID</th>
              <th style="text-align:right">Lessons</th>
              <th style="text-align:right">Questions</th>
              <th>Accuracy</th>
              <th>Last active</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <p class="note" style="max-width:640px;margin-top:16px">
        Progress figures come from what each student's app reports. Their notes, highlights and
        tutor conversations are theirs and are never sent here &mdash; see
        <a href="https://annexity.com/legal">the privacy policy</a>.
      </p>

    </div>
  </div>
</div>

<script src="portal.js?v=2"></script>
<script src="portal-data.js?v=1"></script>
<script>
(async function () {
  if (!await requireSession()) return;

  let roster = [];
  try {
    const ctx = await loadContext();
    if (!ctx.membership) {
      pageError("This account is not on any program's staff list.");
      return;
    }
    CTX = { institution: ctx.membership.institutions, role: ctx.membership.role, email: ctx.email };
    shell("roster.html", "Students", CTX.institution.display_name || CTX.institution.name);
    roster = await loadRoster(CTX.institution.id);
  } catch (err) {
    pageError("Could not load the roster: " + (err.message || err));
    return;
  }

  const rows = document.getElementById("rows");
  const count = document.getElementById("count");
  const search = document.getElementById("search");
  const statusFilter = document.getElementById("statusFilter");

  function render() {
    const q = search.value.trim().toLowerCase();
    const want = statusFilter.value;
    const shown = roster.filter(s =>
      (!want || s.status === want) &&
      (!q || s.name.toLowerCase().includes(q) || String(s.studentNumber).toLowerCase().includes(q))
    );

    count.textContent = shown.length === roster.length
      ? roster.length + (roster.length === 1 ? " student" : " students")
      : shown.length + " of " + roster.length;

    if (!roster.length) {
      // The empty state is the state this table is in on day one, so it says what
      // to do next rather than just reporting that a list is empty.
      rows.innerHTML = '<tr><td colspan="7"><div class="empty">' +
        '<b>No students yet.</b><br>Students appear here once they join your program with its ' +
        'join code. Add them from <a href="account.html">Account</a>, or ' +
        '<a href="https://annexity.com/institutions">talk to us</a> about importing a cohort.' +
        '</div></td></tr>';
      return;
    }
    rows.innerHTML = shown.length
      ? shown.map(studentRow).join("")
      : '<tr><td colspan="7"><div class="empty">Nobody matches that.</div></td></tr>';
  }

  search.addEventListener("input", render);
  statusFilter.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
