<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Account | Annexity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <nav class="side"></nav>
  <div class="main">
    <header class="top"></header>
    <div class="content">
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h2>Your program</h2></div>
        <div class="card-body" id="inst"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Join code</h2></div>
        <div class="card-body">
          <p>Students enter this in the Annexity app to join your program.</p>
          <p class="joincode" id="code">—</p>
          <p class="note" style="margin:0">Anyone with this code can join and take a seat.
             Treat it like a door key.</p>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="portal.js?v=2"></script>
<script src="portal-data.js?v=1"></script>
<script>
(async function () {
  if (!await requireSession()) return;
  try {
    const ctx = await loadContext();
    if (!ctx.membership) { pageError("This account is not on any program's staff list."); return; }
    CTX = { institution: ctx.membership.institutions, role: ctx.membership.role, email: ctx.email };
    shell("account.html", "Account & billing", CTX.institution.display_name || CTX.institution.name);
    const i = CTX.institution;
    document.getElementById("inst").innerHTML =
      '<dl class="facts">' +
      '<dt>Name</dt><dd>' + esc(i.display_name || i.name) + '</dd>' +
      '<dt>Seats</dt><dd>' + (i.seats || 0) + '</dd>' +
      '<dt>Status</dt><dd>' + esc(i.status || "active") + '</dd>' +
      '<dt>Signed in as</dt><dd>' + esc(CTX.email) + ' (' + esc(CTX.role) + ')</dd>' +
      '</dl>';
    const { data: full } = await sb.from("institutions")
      .select("join_code").eq("id", i.id).maybeSingle();
    document.getElementById("code").textContent = (full && full.join_code) || "—";
  } catch (err) {
    pageError("Could not load this page: " + (err.message || err));
  }
})();
</script>
</body>
</html>
